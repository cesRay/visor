[package]
name = "visor"
version = "0.1.0"
edition = "2024"
description = "A ranger-style file navigator with content and filename search for the terminal"
publish = false
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
ignore = "0.4"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
