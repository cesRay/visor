[package]
name = "visor"
version = "0.1.2"
edition = "2024"
description = "A ranger-style file navigator with content and filename search for the terminal"
publish = false
license = "MIT"
repository = "https://github.com/cesRay/visor"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
ignore = "0.4"
anyhow = "1"
nucleo-matcher = { version = "0.3", default-features = false, features = ["unicode-casefold", "unicode-normalization"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# Strip at build time, so cross-compiled binaries need no host strip tool
strip = true

# Debian package (Raspberry Pi OS), built by .github/workflows/release.yml
[package.metadata.deb]
maintainer = "César Rayas <cesRay@users.noreply.github.com>"
copyright = "2026, César Rayas"
depends = "vim"
section = "utils"
priority = "optional"
extended-description = """\
visor is a ranger-style file navigator for the terminal. Browse directories \
with the arrow keys, search file contents with :match and file names with \
:file, and open files in vim. Press Enter on a directory to leave visor and \
cd into it (needs `eval "$(visor init bash)"` in ~/.bashrc)."""
assets = [
    ["target/release/visor", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/visor/README.md", "644"],
    ["THIRD-PARTY-NOTICES.md", "usr/share/doc/visor/THIRD-PARTY-NOTICES.md", "644"],
]
